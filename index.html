<style>
html,body{margin:0;height:100%;overflow:hidden;background:#6cc04a;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
#safe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
"use strict";
/* ================= 花花守护队 =================
   An original, gentle lane-defense garden game for small children.
   Flowers protect the picnic cupcakes from mischievous jellies.
   Everything (art, sound, music) is drawn / generated in code. */

const TAU=Math.PI*2, PI=Math.PI;
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const FONT='"PingFang SC","Hiragino Sans GB","Heiti SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

const cv=document.getElementById("c"), ctx=cv.getContext("2d"), safeEl=document.getElementById("safe");

/* ---------- storage ---------- */
const store={get(k,d){try{const v=localStorage.getItem("hhshd_"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("hhshd_"+k,JSON.stringify(v));}catch(e){}}};
let prog=store.get("prog",{unlocked:1,stars:{},seen:{}});
if(!prog.stars)prog.stars={}; if(!prog.seen)prog.seen={};
let musicOn=store.get("music",true);

/* ---------- drawing helpers ---------- */
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,TAU);}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);}
function starPath(c,x,y,ro,ri,n,rot){n=n||5;rot=rot==null?-PI/2:rot;c.beginPath();for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=rot+i*PI/n;c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}c.closePath();}
function radial(c,x,y,r,stops){const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.05,x,y,r);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g;}
function linear(c,x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g;}
function txt(c,s,x,y,size,col,stroke,align,lw){c.font="bold "+size+"px "+FONT;c.textAlign=align||"center";c.textBaseline="middle";c.lineJoin="round";
  if(stroke){c.lineWidth=lw||Math.max(4,size*.2);c.strokeStyle=stroke;c.strokeText(s,x,y);}c.fillStyle=col||"#fff";c.fillText(s,x,y);}

/* ---------- faces ---------- */
function face(c,x,y,s,o){o=o||{};const mood=o.mood||"happy",lk=(o.look||0)*3*s,ex=13*s;
  c.save();c.translate(x,y);
  c.fillStyle="rgba(255,105,140,"+(mood==="blow"?.7:.42)+")";
  const br=mood==="blow"?1.5:1;
  ell(c,-ex-8*s+lk,10*s,8*s*br,5*s*br);c.fill();ell(c,ex+8*s+lk,10*s,8*s*br,5*s*br);c.fill();
  c.strokeStyle="#3a2230";c.fillStyle="#2b1d2a";c.lineCap="round";c.lineWidth=3*s;
  if(mood==="sleep"||o.blink){
    for(const sx of[-1,1]){c.beginPath();c.arc(sx*ex+lk,-1*s,5.5*s,.15*PI,.85*PI);c.stroke();}
  }else if(mood==="joy"){
    for(const sx of[-1,1]){c.beginPath();c.arc(sx*ex+lk,2*s,6*s,1.15*PI,1.85*PI);c.stroke();}
  }else{
    for(const sx of[-1,1]){ell(c,sx*ex+lk,0,6*s,7.5*s);c.fill();}
    c.fillStyle="#fff";for(const sx of[-1,1]){circ(c,sx*ex+lk+2*s,-3*s,2.4*s);c.fill();circ(c,sx*ex+lk-2*s,2.5*s,1.1*s);c.fill();}
    c.fillStyle="#2b1d2a";
  }
  if(mood==="cheeky"){c.lineWidth=2.6*s;c.beginPath();c.moveTo(-ex-6*s+lk,-12*s);c.lineTo(-ex+5*s+lk,-9*s);c.moveTo(ex+6*s+lk,-12*s);c.lineTo(ex-5*s+lk,-9*s);c.stroke();}
  if(mood==="worry"){c.lineWidth=2.6*s;c.beginPath();c.moveTo(-ex-6*s+lk,-9*s);c.lineTo(-ex+5*s+lk,-13*s);c.moveTo(ex+6*s+lk,-9*s);c.lineTo(ex-5*s+lk,-13*s);c.stroke();}
  c.lineWidth=3*s;
  const my=9*s;
  if(mood==="eat"){const op=(Math.sin((o.t||0)*14)+1)/2;c.fillStyle="#9b2346";ell(c,lk,my+2*s,7*s,(2+op*6)*s);c.fill();
    c.fillStyle="#ff8fab";ell(c,lk,my+(4+op*3)*s,4*s,(1+op*2)*s);c.fill();}
  else if(mood==="blow"){c.fillStyle="#9b2346";circ(c,lk+2*s,my+1*s,4.5*s);c.fill();}
  else if(mood==="worry"){c.beginPath();c.moveTo(lk-6*s,my+3*s);c.quadraticCurveTo(lk,my-1*s,lk+6*s,my+3*s);c.stroke();}
  else if(mood==="cheeky"){c.fillStyle="#9b2346";c.beginPath();c.moveTo(lk-9*s,my-1*s);c.quadraticCurveTo(lk,my+11*s,lk+9*s,my-3*s);c.quadraticCurveTo(lk,my+2*s,lk-9*s,my-1*s);c.fill();
    c.fillStyle="#fff";rr(c,lk-2*s,my,4.5*s,4*s,1*s);c.fill();}
  else if(mood==="joy"||mood==="big"){c.fillStyle="#9b2346";c.beginPath();c.arc(lk,my-1*s,8*s,0,PI);c.closePath();c.fill();c.fillStyle="#ff8fab";ell(c,lk,my+4*s,4.5*s,2.5*s);c.fill();}
  else{c.beginPath();c.arc(lk,my-3*s,6*s,.2*PI,.8*PI);c.stroke();}
  c.restore();}

/* ---------- plants ---------- */
const PLANTS={
  star:{name:"星星花",cost:50,cd:5,hp:300,say:"星星花！它会送你星星哦"},
  bubble:{name:"泡泡花",cost:100,cd:5,hp:300,say:"泡泡花！它会吹泡泡"},
  mush:{name:"胖胖菇",cost:50,cd:16,hp:3200,say:"胖胖菇！它可以挡住果冻哦"},
  snow:{name:"雪花铃",cost:150,cd:7,hp:300,say:"雪花铃！它让果冻慢慢走"},
  dande:{name:"蒲公英",cost:125,cd:22,hp:300,say:"蒲公英！呼——把果冻都吹回去"}
};
const CARD_ORDER=["star","bubble","mush","snow","dande"];

function leaf(c,x,y,ang,len){c.save();c.translate(x,y);c.rotate(ang);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(len*.5,-len*.42,len,0);c.quadraticCurveTo(len*.5,len*.42,0,0);
  c.fillStyle=linear(c,0,-len*.3,0,len*.3,["#8ee05c","#49b04a"]);c.fill();c.strokeStyle="#2f8a3a";c.lineWidth=2.5;c.stroke();
  c.beginPath();c.moveTo(3,0);c.lineTo(len*.8,0);c.strokeStyle="rgba(255,255,255,.45)";c.lineWidth=2;c.stroke();c.restore();}
function stem(c,h,t,sway){c.strokeStyle="#3d9a42";c.lineWidth=9;c.lineCap="round";c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(sway*.4,-h*.5,sway,-h);c.stroke();
  c.strokeStyle="#6fd36a";c.lineWidth=3;c.beginPath();c.moveTo(-2,-4);c.quadraticCurveTo(sway*.4-2,-h*.5,sway-2,-h+4);c.stroke();
  leaf(c,-3,-10,PI+.45+Math.sin(t*2.1)*.08,36);leaf(c,3,-16,-.45-Math.sin(t*2.3)*.08,36);}
function mound(c){c.fillStyle="rgba(40,80,20,.22)";ell(c,0,6,48,13);c.fill();c.fillStyle=linear(c,0,-6,0,10,["#b07a4a","#875a33"]);ell(c,0,2,36,10);c.fill();
  c.fillStyle="rgba(255,255,255,.18)";ell(c,-8,-1,14,3);c.fill();}

function drawPlant(c,type,x,y,s,t,p){
  c.save();c.translate(x,y);c.scale(s,s);
  const blink=((t+(p?p.seed:0))%4.2)<.13;
  let hurt=p&&p.hurtT>0?Math.sin(p.hurtT*60)*3:0;c.translate(hurt,0);
  if(p&&p.bornT<.35){const k=easeBack(clamp(p.bornT/.35,0,1));c.scale(.4+.6*k,.2+.8*k);}
  if(!p||!p.noMound)mound(c);
  const sway=Math.sin(t*1.8+(p?p.seed:0))*4;
  if(type==="star"){
    stem(c,56,t,sway);
    c.save();c.translate(sway,-66+Math.sin(t*2.2)*2);c.rotate(Math.sin(t*1.4)*.08);
    if(p&&p.timer<1.3){const a=(1.3-p.timer)/1.3;c.fillStyle="rgba(255,240,120,"+(.5*a)+")";circ(c,0,0,58+a*10);c.fill();}
    starPath(c,0,0,46,27);c.fillStyle=radial(c,0,0,48,["#fffbd0","#ffd43b","#ff9f1a"]);c.fill();c.lineJoin="round";c.lineWidth=5;c.strokeStyle="#f08400";c.stroke();
    c.fillStyle=radial(c,0,0,22,["#fffdf0","#ffeaa0"]);circ(c,0,2,21);c.fill();
    face(c,0,2,.78,{mood:p&&p.timer<.6?"joy":"happy",blink});c.restore();
  }else if(type==="bubble"||type==="snow"){
    stem(c,54,t,sway);
    const sh=p&&p.shootT>0?p.shootT/.18:0;
    c.save();c.translate(sway-sh*5,-66+Math.sin(t*2)*2);c.scale(1+sh*.08,1-sh*.06);
    if(type==="bubble"){
      c.fillStyle="#ff86b5";c.strokeStyle="#e0558a";c.lineWidth=3.5;
      for(const[a,px,py]of[[-.55,-22,-20],[0,0,-30],[.55,22,-20]]){ell(c,px,py,15,26,a);c.fill();c.stroke();}
      c.fillStyle=radial(c,0,0,34,["#ffe3ee","#ff9cc4","#ff6aa2"]);circ(c,0,0,33);c.fill();c.lineWidth=4;c.stroke();
      c.fillStyle="#ff4f8f";circ(c,31,6,13);c.fill();c.strokeStyle="#d8336f";c.lineWidth=3;c.stroke();c.fillStyle="#ffe8f1";circ(c,32,6,7);c.fill();
      face(c,-6,0,.74,{look:1,mood:sh>0?"blow":"happy",blink});
    }else{
      c.save();c.rotate(t*.3);
      for(let i=0;i<6;i++){c.save();c.rotate(i*TAU/6);ell(c,0,-25,13,22);c.fillStyle=linear(c,0,-47,0,-5,["#ffffff","#a9e3ff"]);c.fill();c.strokeStyle="#5fb6e6";c.lineWidth=3;c.stroke();c.restore();}
      c.restore();
      c.fillStyle=radial(c,0,0,24,["#ffffff","#d6f2ff"]);circ(c,0,0,23);c.fill();c.strokeStyle="#5fb6e6";c.lineWidth=3;c.stroke();
      c.fillStyle="#3aa7e0";circ(c,27,7,8);c.fill();c.fillStyle="#e9f8ff";circ(c,28,7,4);c.fill();
      face(c,-3,1,.7,{look:1,mood:sh>0?"blow":"happy",blink});
      c.save();c.translate(0,-50);c.rotate(t);drawSnowflake(c,0,0,9,"#fff");c.restore();
    }
    c.restore();
  }else if(type==="mush"){
    const hp=p?p.hp/p.max:1,sq=Math.sin(t*2.4+(p?p.seed:0))*.03;
    c.scale(1+sq,1-sq);
    c.fillStyle=linear(c,0,-60,0,0,["#fffaf0","#f2d9b0"]);rr(c,-33,-62,66,62,24);c.fill();c.strokeStyle="#d4ad7a";c.lineWidth=4;c.stroke();
    face(c,0,-28,.9,{mood:hp<.4?"worry":"happy",blink});
    c.beginPath();c.moveTo(-64,-52);c.bezierCurveTo(-66,-128,66,-128,64,-52);c.quadraticCurveTo(0,-36,-64,-52);
    c.fillStyle=linear(c,0,-118,0,-40,["#ff8f8f","#f04a5e","#d1324b"]);c.fill();c.strokeStyle="#b52a42";c.lineWidth=5;c.stroke();
    c.fillStyle="#fff";for(const[dx,dy,rx,ry]of[[-32,-80,11,8],[6,-97,13,9],[38,-72,10,7],[-5,-63,7,5],[-46,-60,5,4]]){ell(c,dx,dy,rx,ry);c.fill();}
    c.fillStyle="rgba(255,255,255,.35)";ell(c,-22,-100,16,7,-.4);c.fill();
    if(hp<.35){c.save();c.translate(26,-88);c.rotate(.6);c.fillStyle="#ffe0b8";rr(c,-18,-7,36,14,5);c.fill();c.strokeStyle="#e5b27c";c.lineWidth=2;c.stroke();
      c.fillStyle="#f0c08d";for(const d of[-6,0,6])for(const e of[-3,3]){circ(c,d,e,1.3);c.fill();}c.restore();}
  }else if(type==="dande"){
    c.strokeStyle="#57a84e";c.lineWidth=6;c.lineCap="round";c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(sway*.4,-30,sway,-58);c.stroke();
    leaf(c,-3,-6,PI+.6,30);leaf(c,3,-10,-.6,30);
    const charge=p?clamp(1-p.timer/.9,0,1):0;
    c.save();c.translate(sway,-82+Math.sin(t*2)*2);const pf=1+charge*.15;c.scale(pf,pf);
    c.fillStyle="rgba(255,255,255,.55)";for(let i=0;i<22;i++){const a=i/22*TAU+t*.2;circ(c,Math.cos(a)*41,Math.sin(a)*41,7);c.fill();}
    c.strokeStyle="rgba(200,215,235,.9)";c.lineWidth=1.5;for(let i=0;i<22;i++){const a=i/22*TAU+t*.2;c.beginPath();c.moveTo(Math.cos(a)*14,Math.sin(a)*14);c.lineTo(Math.cos(a)*40,Math.sin(a)*40);c.stroke();}
    c.fillStyle=radial(c,0,0,34,["#ffffff","#f3f7ff","#dfe8f8"]);circ(c,0,0,33);c.fill();
    face(c,0,2,.78,{mood:charge>.05?"blow":"happy",blink,look:charge>.05?1:0});c.restore();
  }
  c.restore();}
function drawSnowflake(c,x,y,r,col){c.save();c.translate(x,y);c.strokeStyle=col;c.lineWidth=Math.max(1.5,r*.22);c.lineCap="round";
  for(let i=0;i<6;i++){c.rotate(TAU/6);c.beginPath();c.moveTo(0,0);c.lineTo(0,-r);c.moveTo(0,-r*.55);c.lineTo(r*.3,-r*.8);c.moveTo(0,-r*.55);c.lineTo(-r*.3,-r*.8);c.stroke();}c.restore();}

/* ---------- jellies ---------- */
const JELLY={
  jelly:{hp:200,speed:19,s:1,col:["#ffc2e6","#ff7dbd","#e0479a"]},
  hat:{hp:200,hat:260,speed:19,s:1.02,col:["#dcc4ff","#a77bff","#7b4fe0"]},
  fast:{hp:150,speed:38,s:.82,col:["#c8f7a8","#6edb5c","#3aa83a"]},
  king:{hp:1500,speed:11,s:1.55,col:["#ffe0a8","#ffae45","#e27c12"]}
};
function drawCupcake(c,x,y,s){c.save();c.translate(x,y);c.scale(s,s);
  c.beginPath();c.moveTo(-22,-18);c.lineTo(22,-18);c.lineTo(16,10);c.lineTo(-16,10);c.closePath();c.fillStyle=linear(c,-20,0,20,0,["#8fd3ff","#5db7f0"]);c.fill();
  c.strokeStyle="#3c94cc";c.lineWidth=2.5;c.stroke();c.strokeStyle="rgba(255,255,255,.6)";c.lineWidth=2;for(const d of[-10,0,10]){c.beginPath();c.moveTo(d*1.1,-16);c.lineTo(d*.75,8);c.stroke();}
  c.fillStyle=linear(c,0,-50,0,-16,["#fff0f7","#ffb3d4"]);c.strokeStyle="#ef7fae";c.lineWidth=2.5;
  c.beginPath();c.arc(-13,-22,12,PI*.5,PI*1.5);c.arc(0,-34,15,PI,0);c.arc(13,-22,12,PI*1.5,PI*.5);c.closePath();c.fill();c.stroke();
  const sp=["#ffd43b","#5fd35a","#5db7f0","#b07bff"];for(let i=0;i<7;i++){c.fillStyle=sp[i%4];c.save();c.translate(-14+i*4.5,-26-(i%3)*6);c.rotate(i);rr(c,-3,-1,6,2.4,1);c.fill();c.restore();}
  c.fillStyle=radial(c,0,-52,8,["#ff8a8a","#e8243c"]);circ(c,0,-51,7.5);c.fill();c.strokeStyle="#5a8a2a";c.lineWidth=2;c.beginPath();c.moveTo(0,-57);c.quadraticCurveTo(3,-65,7,-66);c.stroke();
  c.fillStyle="#fff";circ(c,-2.5,-53,2);c.fill();c.restore();}
function drawJellyBody(c,type,t,seed,o){o=o||{};const J=JELLY[type],col=J.col,w=48,h=60;
  const wob=Math.sin(t*6+seed)*.06;
  c.save();c.scale(1+wob+(o.squash||0)*.15,1-wob-(o.squash||0)*.15);
  c.beginPath();c.moveTo(-w,0);c.bezierCurveTo(-w-4,-h*1.35,w+4,-h*1.35,w,0);c.quadraticCurveTo(w*.5,8,0,3);c.quadraticCurveTo(-w*.5,8,-w,0);c.closePath();
  c.fillStyle=linear(c,0,-h,0,4,[col[0],col[1]]);c.fill();c.strokeStyle=col[2];c.lineWidth=4;c.stroke();
  if(o.slow){c.fillStyle="rgba(150,215,255,.45)";c.fill();}
  c.fillStyle="rgba(255,255,255,.6)";ell(c,-20,-48,11,6.5,-.6);c.fill();circ(c,-6,-55,3.2);c.fill();
  c.fillStyle="rgba(255,255,255,.25)";ell(c,18,-14,9,5,.4);c.fill();
  face(c,-9,-26,1,{mood:o.mood||"cheeky",look:-1,t,blink:o.mood!=="sleep"&&((t+seed)%3.7)<.12});
  if(o.slow){c.save();c.translate(22,-40);drawSnowflake(c,0,0,8,"#e8f8ff");c.restore();}
  if(type==="king"){c.save();c.translate(0,-76);c.beginPath();c.moveTo(-24,6);c.lineTo(-28,-16);c.lineTo(-13,-5);c.lineTo(0,-22);c.lineTo(13,-5);c.lineTo(28,-16);c.lineTo(24,6);c.closePath();
    c.fillStyle=linear(c,0,-22,0,6,["#fff3a0","#ffc21a"]);c.fill();c.strokeStyle="#d48a00";c.lineWidth=3;c.stroke();
    c.fillStyle="#ff5f8f";circ(c,0,-3,4);c.fill();c.fillStyle="#5db7f0";circ(c,-15,0,3);c.fill();circ(c,15,0,3);c.fill();c.restore();}
  if(type==="hat"&&o.hat){c.save();c.translate(6,-70);c.rotate(-.15);drawCupcake(c,0,8,.85);c.restore();}
  c.restore();}

/* ---------- layout ---------- */
let CW=0,CH=0,DPR=1,rot=false,LW=1600,LH=900,SC=1,OX=0,OY=0,safeL=0,safeR=0;
const ROWS=5,COLS=9,CELL=140,TOPY=182;
let LX=220,BARX=20;
function rowY(r){return TOPY+r*CELL+CELL/2;}
function colX(c){return LX+c*CELL+CELL/2;}
function resize(){
  CW=window.innerWidth;CH=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);cv.style.width=CW+"px";cv.style.height=CH+"px";
  rot=CH>CW*1.05;
  const vw=rot?CH:CW,vh=rot?CW:CH;
  const st=getComputedStyle(safeEl);const it=parseFloat(st.paddingTop)||0,ir=parseFloat(st.paddingRight)||0,ib=parseFloat(st.paddingBottom)||0,il=parseFloat(st.paddingLeft)||0;
  const vl=rot?it:il,vr=rot?ib:ir;
  LW=clamp(vw/vh*LH,1520,2100);SC=Math.min(vw/LW,vh/LH);OX=(vw-LW*SC)/2;OY=(vh-LH*SC)/2;
  safeL=Math.max(0,(vl-OX)/SC);safeR=Math.max(0,(vr-OX)/SC);
  const usable=LW-safeL-safeR,free=usable-1410;
  LX=safeL+150+(free>0?free*.32:free);
  BARX=Math.max(safeL+14,LX-150);
  bgDirty=true;
}
function toLogical(px,py){let vx=px,vy=py;if(rot){vx=py;vy=CW-px;}return{x:(vx-OX)/SC,y:(vy-OY)/SC};}

/* ---------- audio ---------- */
let AC=null,master=null,musicGain=null;
function initAudio(){
  if(AC){if(AC.state!=="running")AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=musicOn?.2:0;musicGain.connect(master);
    const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);}catch(e){AC=null;}
}
function tone(f0,f1,dur,type,vol,when,dest){if(!AC)return;const t=AC.currentTime+(when||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq,when){if(!AC)return;const t=AC.currentTime+(when||0);const n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=freq||1200;f.Q.value=.8;
  const g=AC.createGain();g.gain.value=vol||.1;s.connect(f);f.connect(g);g.connect(master);s.start(t);}
const SFX={
  tap(){tone(660,880,.07,"sine",.12);},
  select(){tone(520,780,.1,"triangle",.15);},
  plant(){tone(260,520,.16,"sine",.25);tone(520,700,.12,"triangle",.12,.08);noise(.12,.12,600);},
  shoot(){tone(500+Math.random()*120,900,.09,"sine",.08);},
  hit(){tone(420,210,.08,"sine",.1);},
  collect(){tone(988,988,.12,"triangle",.14);tone(1319,1319,.18,"triangle",.14,.07);tone(1760,1760,.2,"sine",.08,.13);},
  sleep(){tone(880,330,.45,"triangle",.12);tone(1320,1320,.1,"sine",.06,.4);},
  chomp(){tone(140,90,.07,"square",.035);},
  steal(){tone(520,520,.14,"triangle",.15);tone(392,392,.22,"triangle",.15,.15);},
  no(){tone(300,260,.12,"sine",.12);tone(260,230,.14,"sine",.12,.12);},
  wave(){[392,523,659,784].forEach((f,i)=>tone(f,f,.2,"triangle",.14,i*.11));},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,f,.25,"triangle",.17,i*.13));},
  lose(){[523,440,392].forEach((f,i)=>tone(f,f*.97,.3,"triangle",.13,i*.22));},
  wind(){noise(1.1,.18,500);noise(.9,.1,1400,.15);},
  star(){tone(1200,1600,.15,"sine",.07);}
};
const MEL=[0,4,7,4,9,7,4,null,2,4,7,9,7,null,4,null,0,4,7,12,9,7,4,2,4,2,0,2,0,null,null,null,
  7,9,12,9,7,4,2,null,4,7,9,7,4,2,0,null,2,4,2,0,-3,0,2,4,0,null,null,null,null,null,null,null];
const BASS=[-24,-24,-15,-15,-19,-19,-17,-17];
let mStep=0,mNext=0;
function noteF(n){return 523.25*Math.pow(2,n/12);}
function musicTick(){if(!AC||AC.state!=="running")return;const step=.27;
  if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.35){const i=mStep%MEL.length,n=MEL[i],w=mNext-AC.currentTime;
    if(n!=null)tone(noteF(n),noteF(n),.32,"triangle",.11,w,musicGain);
    if(i%4===0)tone(noteF(BASS[(i/4|0)%8]),noteF(BASS[(i/4|0)%8]),.9,"sine",.13,w,musicGain);
    if(i%2===1)tone(noteF(BASS[(i/4|0)%8]+19),noteF(BASS[(i/4|0)%8]+19),.12,"sine",.03,w,musicGain);
    mNext+=step;mStep++;}}
setInterval(musicTick,90);
function setMusic(on){musicOn=on;store.set("music",on);if(musicGain&&AC)musicGain.gain.setTargetAtTime(on?.2:0,AC.currentTime,.1);}

/* ---------- voice ---------- */
const synth=window.speechSynthesis;let zhVoice=null,lastSay=0;
function pickVoice(){if(!synth)return;const all=synth.getVoices();const zh=all.filter(v=>/^zh[-_](CN|Hans)/i.test(v.lang)||v.lang==="zh");
  zhVoice=zh.find(v=>/Tingting|婷婷|Lili|Xiaoxiao|普通话/i.test(v.name))||zh[0]||all.find(v=>/^zh/i.test(v.lang)&&!/HK|TW/i.test(v.lang))||null;}
if(synth){pickVoice();if(synth.addEventListener)synth.addEventListener("voiceschanged",pickVoice);else synth.onvoiceschanged=pickVoice;}
function say(text,force){if(!synth)return;const now=performance.now();if(!force&&synth.speaking&&now-lastSay<1800)return;lastSay=now;
  try{synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";if(zhVoice)u.voice=zhVoice;u.rate=.95;u.pitch=1.2;synth.speak(u);}catch(e){}}

  {rows:[0,1,2,3,4],cards:4,n:14,mix:{jelly:.7,hat:.3},first:20,gap:[14,7],wave:true,intro:"snow",sky:[7,10]},
  {rows:[0,1,2,3,4],cards:4,n:16,mix:{jelly:.55,hat:.25,fast:.2},first:20,gap:[13,6.5],wave:true,introJ:"fast",sky:[8,10]},
  {rows:[0,1,2,3,4],cards:5,n:19,mix:{jelly:.5,hat:.25,fast:.25},first:20,gap:[12,6],wave:true,intro:"dande",sky:[8,10]},
  {rows:[0,1,2,3,4],cards:5,n:22,mix:{jelly:.4,hat:.35,fast:.25},first:18,gap:[11,5.5],wave:true,sky:[8,11]},
  {rows:[0,1,2,3,4],cards:5,n:25,mix:{jelly:.4,hat:.35,fast:.25},first:18,gap:[11,5],wave:true,king:1,introJ:"king",sky:[8,11]},
  {rows:[0,1,2,3,4],cards:5,n:28,mix:{jelly:.35,hat:.35,fast:.3},first:18,gap:[10,4.8],wave:true,king:2,sky:[8,11]}
];
function pickMix(m){let r=Math.random(),acc=0;for(const k in m){acc+=m[k];if(r<=acc)return k;}return"jelly";}
function makeSchedule(L){
  const list=[];let t=L.first,lastRow=-1;
  const pickRow=()=>{let r;let tries=0;do{r=L.rows[Math.floor(Math.random()*L.rows.length)];}while(r===lastRow&&L.rows.length>1&&tries++<5);lastRow=r;return r;};
  const nMain=L.wave?Math.round(L.n*.6):L.n;
  for(let i=0;i<nMain;i++){list.push({t,type:i<2?"jelly":pickMix(L.mix),row:pickRow()});t+=lerp(L.gap[0],L.gap[1],nMain>1?i/(nMain-1):1)*rand(.85,1.15);}
  if(L.wave){t+=8;list.push({t,flag:true});t+=3;
    const rest=L.n-nMain;let kings=L.king||0;
    for(let i=0;i<rest;i++){let type=pickMix(L.mix);if(kings>0&&i===Math.floor(rest*(kings===2?.25:.5))){type="king";kings--;}else if(kings>0&&i===rest-2){type="king";kings--;}
      list.push({t,type,row:pickRow()});t+=rand(1.4,2.6);}}
  return list;}

/* ---------- game state ---------- */
const G={screen:"title",t:0,lvl:0,L:null};
let grid=[],plants=[],enemies=[],proj=[],stars=[],parts=[],texts=[],clouds=[],flies=[];
let buttons=[],pressed=null;

function startLevel(i,skipIntro){
  const L=LEVELS[i];G.lvl=i;G.L=L;
  if(!skipIntro&&L.intro&&!prog.seen[L.intro]){G.screen="friend";G.friend=L.intro;G.friendT=0;say("新朋友，"+PLANTS[L.intro].say,true);SFX.win();return;}
  grid=[];for(let r=0;r<ROWS;r++)grid.push(new Array(COLS).fill(null));
  plants=[];enemies=[];proj=[];stars=[];parts=[];texts=[];
  G.sun=150;G.time=0;G.sched=makeSchedule(L);G.si=0;G.total=G.sched.filter(e=>!e.flag).length;G.spawned=0;G.slept=0;
  G.cup=[true,true,true,true,true];G.cupAnim=[0,0,0,0,0];
  G.cards=CARD_ORDER.slice(0,L.cards).map(k=>({k,cd:0,shake:0}));G.sel=null;G.skyT=4;G.idle=0;G.endT=0;G.result=null;
  G.banner={text:"第"+(i+1)+"关",sub:"种花，保护蛋糕！",t:0,dur:2.6};G.sunBump=0;G.saidSleep=false;G.saidSteal=0;
  G.screen="play";G.paused=false;bgDirty=true;
  if(i===0)say("果冻要来偷蛋糕啦！先种星星花吧！",true);
  else if(L.introJ==="fast")say("小心，跳跳果冻跑得很快哦！",true);
  else if(L.introJ==="king")say("果冻大王要来啦！多种一些泡泡花吧！",true);
  else say("第"+(i+1)+"关，加油！",true);
}

/* ---------- spawning & entities ---------- */
function spawnEnemy(type,row){const J=JELLY[type];
  enemies.push({type,row,x:LW+60,y:rowY(row)+44,hp:J.hp,max:J.hp,hat:J.hat||0,speed:J.speed*rand(.92,1.08),s:J.s,state:"walk",target:null,
    slowT:0,hitT:0,seed:Math.random()*10,chompT:0,kb:0,life:0,vy:0});G.spawned++;}
function addPlant(k,r,c){const P=PLANTS[k];const p={k,r,c,x:colX(c),y:rowY(r)+48,hp:P.hp,max:P.hp,timer:k==="star"?5:k==="dande"?.9:.6,hurtT:0,shootT:0,bornT:0,seed:Math.random()*10};
  plants.push(p);grid[r][c]=p;
  for(let i=0;i<12;i++)parts.push({k:"dot",x:p.x+rand(-30,30),y:p.y,vx:rand(-120,120),vy:rand(-260,-80),g:600,life:.7,max:.7,size:rand(5,9),col:i%2?"#a7744a":"#8ee05c"});
  for(let i=0;i<8;i++)parts.push({k:"spark",x:p.x+rand(-40,40),y:p.y-rand(20,90),vx:rand(-40,40),vy:rand(-80,-20),g:0,life:.8,max:.8,size:rand(8,14),col:"#fff6a0"});}
function removePlant(p,poof){const i=plants.indexOf(p);if(i>=0)plants.splice(i,1);if(grid[p.r][p.c]===p)grid[p.r][p.c]=null;
  if(poof)for(let i=0;i<14;i++)parts.push({k:"leaf",x:p.x+rand(-20,20),y:p.y-rand(20,70),vx:rand(-150,150),vy:rand(-250,-60),g:400,life:1,max:1,size:rand(8,13),col:"#6fd36a",rot:rand(0,6),vr:rand(-8,8)});}
function makeStar(x,y,mode,val){const s={x,y,ty:y,vx:0,vy:0,mode,val:val||25,life:0,t:Math.random()*6,ft:0,fx:0,fy:0};
  if(mode==="fall"){s.ty=rand(TOPY+80,TOPY+CELL*ROWS-40);s.y=-50;}
  if(mode==="pop"){s.vx=rand(-70,70);s.vy=-360;s.ty=y+rand(-5,25);}
  stars.push(s);return s;}
function collectStar(s){if(s.mode==="fly")return;s.mode="fly";s.ft=0;s.fx=s.x;s.fy=s.y;SFX.star();
  for(let i=0;i<6;i++)parts.push({k:"spark",x:s.x,y:s.y,vx:rand(-160,160),vy:rand(-160,160),g:0,life:.5,max:.5,size:rand(7,12),col:"#fff3a0"});}
function sleepEnemy(e){e.state="sleep";e.life=0;e.vy=0;G.slept++;SFX.sleep();
  for(let i=0;i<10;i++)parts.push({k:"heart",x:e.x+rand(-30,30),y:e.y-rand(20,70),vx:rand(-60,60),vy:rand(-120,-40),g:0,life:1.1,max:1.1,size:rand(10,16),col:["#ff7eb6","#ffd43b","#8fd3ff"][i%3]});
  if(!G.saidSleep){G.saidSleep=true;say("好棒！果冻睡着啦！");}}
function hurtEnemy(e,d,slow){e.hitT=.12;if(slow)e.slowT=4;
  if(e.hat>0){e.hat-=d;if(e.hat<=0){e.hat=0;SFX.hit();for(let i=0;i<10;i++)parts.push({k:"dot",x:e.x,y:e.y-90,vx:rand(-150,150),vy:rand(-300,-100),g:700,life:.8,max:.8,size:rand(6,10),col:["#ffb3d4","#8fd3ff","#ffd43b"][i%3]});}return;}
  e.hp-=d;if(e.hp<=0)sleepEnemy(e);}
function activeEnemy(e){return e.state==="walk"||e.state==="eat";}

/* ---------- update ---------- */
function updatePlay(dt){
  G.time+=dt;G.idle+=dt;
  if(G.banner){G.banner.t+=dt;if(G.banner.t>G.banner.dur)G.banner=null;}
  G.sunBump=Math.max(0,G.sunBump-dt*3);
  for(const cd of G.cards){cd.cd=Math.max(0,cd.cd-dt);cd.shake=Math.max(0,cd.shake-dt);}
  // spawning
  while(G.si<G.sched.length&&G.sched[G.si].t<=G.time){const ev=G.sched[G.si++];
    if(ev.flag){G.banner={text:"一大群果冻来啦！",sub:"",t:0,dur:2.8,big:true};SFX.wave();say("一大群果冻来啦！",true);}
    else spawnEnemy(ev.type,ev.row);}
  // sky stars
  G.skyT-=dt;if(G.skyT<=0&&!G.result){G.skyT=rand(G.L.sky[0],G.L.sky[1]);makeStar(rand(LX+60,LX+COLS*CELL-60),0,"fall");}
  // plants
  for(const p of plants.slice()){p.bornT+=dt;p.hurtT=Math.max(0,p.hurtT-dt);p.shootT=Math.max(0,p.shootT-dt);p.timer-=dt;
    if(p.k==="star"&&p.timer<=0){p.timer=10;makeStar(p.x,p.y-70,"pop");SFX.select();}
    else if((p.k==="bubble"||p.k==="snow")&&p.timer<=0){
      const has=enemies.some(e=>e.row===p.r&&activeEnemy(e)&&e.x>p.x-30&&e.x<LW-safeR-20);
      if(has){p.timer=p.k==="snow"?1.6:1.45;p.shootT=.18;SFX.shoot();
        proj.push({k:p.k,row:p.r,x:p.x+38,y:p.y-60,vx:520,t:0});}else p.timer=.15;}
    else if(p.k==="dande"&&p.timer<=0){
      SFX.wind();say("呼——");
      for(const e of enemies)if(e.row===p.r&&activeEnemy(e)&&e.x>p.x-60){e.kb=380;hurtEnemy(e,e.hat>0?e.hat:300,false);if(e.state!=="sleep"&&e.hp>0){e.hp-=0;}e.state=e.state==="sleep"?"sleep":"walk";e.target=null;}
      for(let i=0;i<40;i++)parts.push({k:"wind",x:p.x+rand(0,200),y:rowY(p.r)+rand(-50,40),vx:rand(500,900),vy:rand(-30,30),g:0,life:1.4,max:1.4,size:rand(20,46),col:"rgba(255,255,255,.8)"});
      for(let i=0;i<16;i++)parts.push({k:"seed",x:p.x+rand(-30,30),y:p.y-80+rand(-30,30),vx:rand(150,420),vy:rand(-120,40),g:-20,life:2,max:2,size:rand(10,16),rot:0,vr:rand(-2,2)});
      removePlant(p,false);}
  }
  // projectiles
  for(let i=proj.length-1;i>=0;i--){const b=proj[i];b.x+=b.vx*dt;b.t+=dt;let hit=null;
    for(const e of enemies){if(e.row!==b.row||!activeEnemy(e))continue;if(Math.abs(b.x-e.x)<38*e.s&&(!hit||e.x<hit.x))hit=e;}
    if(hit){hurtEnemy(hit,20,b.k==="snow");SFX.hit();proj.splice(i,1);
      for(let j=0;j<7;j++)parts.push({k:b.k==="snow"?"snow":"ring",x:b.x,y:b.y,vx:rand(-120,80),vy:rand(-120,120),g:0,life:.45,max:.45,size:rand(5,10),col:b.k==="snow"?"#dff6ff":"#ffd1e6"});continue;}
    if(b.x>LW+40)proj.splice(i,1);}
  // enemies
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.hitT=Math.max(0,e.hitT-dt);e.slowT=Math.max(0,e.slowT-dt);const sf=e.slowT>0?.5:1;
    if(e.kb>0){const m=Math.min(e.kb,dt*700);e.x+=m;e.kb-=m;}
    if(e.state==="walk"){
      let blk=null;for(const p of plants){if(p.r!==e.row)continue;const d=e.x-p.x;if(d>-25&&d<52*e.s+8&&(!blk||p.x>blk.x))blk=p;}
      if(blk){e.state="eat";e.target=blk;}
      else{e.x-=e.speed*sf*dt;
        if(e.x<LX-30){let ci=e.row;if(!G.cup[ci]){let best=-1,bd=99;for(let k=0;k<5;k++)if(G.cup[k]&&Math.abs(k-e.row)<bd){bd=Math.abs(k-e.row);best=k;}ci=best;}
          if(ci>=0){G.cup[ci]=false;G.cupAnim[ci]=1;e.state="flee";e.carry=true;SFX.steal();
            if(G.cup.some(x=>x)){if(G.time-G.saidSteal>6){G.saidSteal=G.time;say("哎呀，蛋糕被拿走一个！");}}}
          else e.state="flee";}}}
    else if(e.state==="eat"){const p=e.target;if(!p||plants.indexOf(p)<0){e.state="walk";e.target=null;}
      else{p.hp-=45*sf*dt;p.hurtT=.15;e.chompT-=dt;if(e.chompT<=0){e.chompT=.45;SFX.chomp();parts.push({k:"dot",x:p.x+15,y:p.y-40,vx:rand(-60,60),vy:rand(-160,-60),g:500,life:.5,max:.5,size:5,col:"#8ee05c"});}
        if(p.hp<=0){removePlant(p,true);e.state="walk";e.target=null;}}}
    else if(e.state==="sleep"){e.life+=dt;e.vy=Math.min(e.vy+dt*40,70);if(e.life>.8){e.y-=e.vy*dt;e.x+=Math.sin(e.life*2+e.seed)*20*dt;}
      if(Math.random()<dt*1.5)parts.push({k:"z",x:e.x+25,y:e.y-70*e.s,vx:20,vy:-40,g:0,life:1.2,max:1.2,size:22,col:"#6a5acd"});
      if(e.life>4.2||e.y<-120)enemies.splice(i,1);}
    else if(e.state==="flee"){e.x+=150*dt;if(e.x>LW+80)enemies.splice(i,1);}
  }
  // stars
  for(let i=stars.length-1;i>=0;i--){const s=stars[i];s.t+=dt;
    if(s.mode==="fall"){s.y+=90*dt;s.x+=Math.sin(s.t*2)*20*dt;if(s.y>=s.ty){s.y=s.ty;s.mode="rest";s.life=0;}}
    else if(s.mode==="pop"){s.vy+=900*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.vy>0&&s.y>=s.ty){s.y=s.ty;s.mode="rest";s.life=0;}}
    else if(s.mode==="rest"){s.life+=dt;if(s.life>7.5)collectStar(s);}
    else if(s.mode==="fly"){s.ft+=dt/.6;const k=easeOut(Math.min(1,s.ft));const tx=BARX+56,ty=86;s.x=lerp(s.fx,tx,k);s.y=lerp(s.fy,ty,k)-Math.sin(k*PI)*80;
      if(s.ft>=1){G.sun+=s.val;G.sunBump=1;SFX.collect();texts.push({x:tx+40,y:ty+40,s:"+"+s.val,t:0});stars.splice(i,1);}}}
  updateParts(dt);
  for(let i=texts.length-1;i>=0;i--){texts[i].t+=dt;if(texts[i].t>1)texts.splice(i,1);}
  for(let k=0;k<5;k++)G.cupAnim[k]=Math.max(0,G.cupAnim[k]-dt);
  // end conditions
  if(!G.result){
    if(!G.cup.some(x=>x)){G.result="lose";G.endT=0;}
    else if(G.si>=G.sched.length&&!enemies.some(e=>activeEnemy(e))){G.result="win";G.endT=0;}}
  else{G.endT+=dt;
    if(G.result==="win"&&G.endT>1.6&&G.screen==="play"){winLevel();}
    if(G.result==="lose"&&G.endT>1.8&&G.screen==="play"){G.screen="lose";G.overT=0;SFX.lose();say("没关系，再来一次吧！",true);}}
}
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
  p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;if(p.k==="wind"){p.vx*=.985;}}}
function winLevel(){const cups=G.cup.filter(x=>x).length;const st=cups>=5?3:cups>=3?2:1;G.starsWon=st;
  prog.stars[G.lvl]=Math.max(prog.stars[G.lvl]||0,st);prog.unlocked=Math.max(prog.unlocked,Math.min(LEVELS.length,G.lvl+2));store.set("prog",prog);
  G.screen="win";G.overT=0;SFX.win();
  say(G.lvl===LEVELS.length-1?"太厉害啦！你是花园小英雄！":"太棒啦！你保护了花园！",true);
  for(let i=0;i<120;i++)confetti();}

/* ---------- input ---------- */
function onTap(x,y){
  initAudio();G.idle=0;
  for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(x>=b.x-8&&x<=b.x+b.w+8&&y>=b.y-8&&y<=b.y+b.h+8){pressed={id:b.id,t:0};b.fn();return;}}
  if(G.screen!=="play"||G.paused)return;
  // stars first (generous radius)
  let best=null,bd=1e9;for(const s of stars){if(s.mode==="fly")continue;const d=(s.x-x)**2+(s.y-y)**2;if(d<bd){bd=d;best=s;}}
  if(best&&bd<75*75){collectStar(best);return;}
  // lawn
  const c=Math.floor((x-LX)/CELL),r=Math.floor((y-TOPY)/CELL);
  if(c<0||c>=COLS||r<0||r>=ROWS)return;
  if(!G.L.rows.includes(r))return;
  if(G.sel==="shovel"){const p=grid[r][c];if(p){removePlant(p,true);SFX.plant();G.sel=null;}return;}
  if(G.sel){const card=G.cards.find(cd=>cd.k===G.sel);const P=PLANTS[G.sel];
    if(grid[r][c]){SFX.no();return;}
    if(card&&card.cd<=0&&G.sun>=P.cost){G.sun-=P.cost;card.cd=P.cd;addPlant(G.sel,r,c);SFX.plant();G.sel=null;}
    return;}
  // tapping a lawn cell with nothing selected: gently point at the cards
  if(!grid[r][c]){G.hintNow=1.5;}
}
function tapCard(cd){const P=PLANTS[cd.k];
  if(G.sel===cd.k){G.sel=null;SFX.tap();return;}
  if(cd.cd>0){cd.shake=.4;SFX.no();say("等一下下哦");return;}
  if(G.sun<P.cost){cd.shake=.4;SFX.no();say("星星不够哦，再收集一些吧");G.hintNow=2;return;}
  G.sel=cd.k;SFX.select();say(P.name);}
